[project]
name = "slack-runtests"
version = "0.1.0"
description = "Prototype: run a pytest suite from a Slack slash command."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.0",
]

[project.scripts]
slack-runtests = "slack_runtests.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_runtests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
# `tests/sample` is deliberately EXCLUDED from the default run: it is the suite
# the server executes on demand, not part of this project's own gate. Running it
# here would conflate "the prototype works" with "the demo suite passes".
testpaths = ["tests/unit"]
markers = [
    "unit: fast, no I/O",
    "smoke: the sample suite the Slack command runs",
]
